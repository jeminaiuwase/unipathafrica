<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Admin console · UniPath Africa</title>
  <link rel="icon" href="/assets/img/icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/styles.css">
  <style>
    body { padding-bottom: 0 !important; }
    .adm { display: grid; grid-template-columns: 250px minmax(0, 1fr); min-height: 100vh; }
    .adm-side { background: var(--ink); color: #cfd8d4; padding: 18px 14px; position: sticky; top: 0; height: 100vh; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; }
    :root[data-theme="dark"] .adm-side { background: #060D0B; }
    .adm-side .brand { color: #fff; margin: 4px 6px 18px; }
    .adm-side .brand small { color: #93a49d; }
    .adm-side a, .adm-side button.navbtn { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 10px; color: inherit; text-decoration: none; font-weight: 600; font-size: .9rem; background: none; border: 0; font-family: inherit; cursor: pointer; width: 100%; text-align: left; }
    .adm-side a svg, .adm-side button.navbtn svg { width: 18px; height: 18px; opacity: .8; }
    .adm-side a:hover { background: rgba(255,255,255,.07); color: #fff; }
    .adm-side a.active { background: var(--sun); color: #2A1B00; }
    .adm-side a .n { margin-left: auto; font-size: .72rem; background: rgba(255,255,255,.12); padding: 1px 8px; border-radius: 99px; }
    .adm-side a.active .n { background: rgba(0,0,0,.12); }
    .adm-side .sep { font-size: .68rem; letter-spacing: .14em; text-transform: uppercase; color: #7c8c86; margin: 14px 12px 4px; font-weight: 800; }
    .adm-main { padding: 26px 30px 60px; min-width: 0; }
    .adm-top { display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; margin-bottom: 22px; }
    .adm-top h1 { font-size: 1.9rem; margin: 0; }
    .draft-pill { display: inline-flex; gap: 8px; align-items: center; font-size: .82rem; font-weight: 700; padding: 6px 12px; border-radius: 99px; }
    .draft-pill.dirty { background: var(--sun-soft); color: var(--warn); }
    .draft-pill.clean { background: var(--brand-soft); color: var(--brand); }
    .draft-pill svg { width: 15px; height: 15px; }
    .login { min-height: 100vh; display: grid; place-items: center; padding: 20px; background: radial-gradient(800px 400px at 80% 0%, color-mix(in srgb, var(--sun) 25%, transparent), transparent), var(--bg); }
    .login .card { width: min(420px, 100%); }
    .tbl td .acts { display: flex; gap: 4px; justify-content: flex-end; }
    .tbl td .acts .icon-btn { width: 32px; height: 32px; border-radius: 9px; }
    .tbl td .acts .icon-btn svg { width: 16px; height: 16px; }
    .clip { max-width: 280px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .health li { padding: 10px 0; border-bottom: 1px dashed var(--line); }
    .health li:last-child { border: 0; }
    .steps-num { counter-reset: s; list-style: none; padding: 0; margin: 0; display: grid; gap: 14px; }
    .steps-num li { counter-increment: s; display: grid; grid-template-columns: 34px 1fr; gap: 12px; align-items: start; }
    .steps-num li::before { content: counter(s); width: 30px; height: 30px; border-radius: 50%; background: var(--ink); color: var(--bg); display: grid; place-items: center; font-weight: 800; font-size: .85rem; }
    .mobile-nav { display: none; }
    @media (max-width: 900px) {
      .adm { grid-template-columns: 1fr; }
      .adm-side { position: fixed; z-index: 120; left: 0; top: 0; width: 270px; transform: translateX(-100%); transition: transform .2s; }
      .adm-side.open { transform: none; box-shadow: var(--shadow-lg); }
      .adm-main { padding: 18px 16px 60px; }
      .mobile-nav { display: inline-grid; }
    }
    .bar-mini { display: grid; grid-template-columns: 1fr 70px; gap: 8px; align-items: center; font-size: .85rem; margin: 6px 0; }
    .bar-mini .track { height: 10px; background: var(--bg-2); border-radius: 5px; overflow: hidden; grid-column: 1 / -1; }
    .bar-mini .fill { height: 100%; background: var(--brand); border-radius: 5px; }
  </style>
  <script>(function(){try{var t=localStorage.getItem('unipath.admin.theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.dataset.theme=t;}catch(e){}})();</script>
</head>
<body>
  <div id="root"><div class="login"><p class="muted">Loading admin…</p></div></div>
  <script src="/assets/js/core.js"></script>
  <script src="/assets/js/admin.js"></script>
</body>
</html>
